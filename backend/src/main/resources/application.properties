spring.application.name=cloudshare

server.servlet.context-path=/api/v1.0

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cloudshare
spring.datasource.username=postgres
spring.datasource.password=komal15

# JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Spring Boot default login page
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Clerk Configuration
clerk.issuer=https://in-pigeon-50.clerk.accounts.dev
clerk.jwks-url=https://in-pigeon-50.clerk.accounts.dev/.well-known/jwks.json