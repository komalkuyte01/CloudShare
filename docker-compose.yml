version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: cloudshare-backend
    ports:
      - "8080:8080"
    environment:
      # Database — AWS RDS PostgreSQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cloudshare-db.cxwgw2soqlco.ap-south-1.rds.amazonaws.com:5432/cloudshare
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}

      # Clerk Authentication
      - CLERK_ISSUER=${CLERK_ISSUER}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - CLERK_WEBHOOK_VERIFY=${CLERK_WEBHOOK_VERIFY:-true}

      # Razorpay
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}

      # JPA
      - SPRING_JPA_DDL_AUTO=${SPRING_JPA_DDL_AUTO:-update}
    volumes:
      # Map the local uploads folder to the container so files aren't lost when Docker restarts
      - ./uploads:/app/uploads
    restart: unless-stopped


