version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: cloudshare-backend
    ports:
      - "8080:8080"
    environment:
      # Override the database URL to point to the host machine's PostgreSQL instead of localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/cloudshare
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=komal15
    volumes:
      # Map the local uploads folder to the container so files aren't lost when Docker restarts
      - ./uploads:/app/uploads
    restart: unless-stopped
